registry_name: Mplus分析规则登记
version: 1.1beta
rules:
  - id: LPA-HARD-001
    type: hard_gate
    rule: 标准LPA指标必须为数值型连续变量；发现分类指标时阻止套用LPA基础模板。
    sources: [MPLUS-EX7.9, MASYN-2013]
    note: “分类指标”来自变量的测量定义与研究者确认，不由唯一值数自动定义。

  - id: LPA-SCREEN-001
    type: internal_heuristic
    rule: 指标的非缺失唯一值不超过 10 时暂停并请用户确认指标尺度；确认后可继续。
    sources: [RHEMTULLA-ETAL-2012]
    origin: 本Skill内部防误导筛查线
    note: 10 不是文献通用分界值；不可仅凭类别数判定连续或分类处理。

  - id: DATA-HARD-001
    type: hard_gate
    rule: 数据转换前后记录数必须一致，除非分析设计清单明确记录了筛选规则。
    sources: []
    origin: 软件质量规则

  - id: DATA-HARD-002
    type: hard_gate
    rule: Mplus内部变量顺序必须与NAMES语句完全一致，并通过变量对应表回查。
    sources: [MPLUS-LANGUAGE]

  - id: LPA-HARD-002
    type: hard_gate
    rule: K>=2的混合模型必须正常结束且最佳loglikelihood被重复获得；否则不得进入最终类别数比较。
    sources: [MPLUS-EX7.9, MPLUS-WN14]

  - id: MPLUS-HARD-001
    type: hard_gate
    rule: 输出中存在*** ERROR或未正常终止时禁止生成论文式结论。
    sources: []
    origin: 软件质量规则

  - id: LPA-WARN-001
    type: warning
    rule: TECH14出现局部最优、bootstrap draw未收敛或p值可信度警告时，将TECH14标记为不可用证据。
    sources: [MPLUS-WN14, MPLUS-UG-TECH14]

  - id: LPA-START-001
    type: workflow_policy
    rule: 随机起始值采用逐级升级而非固定“神奇数字”：screening -> verification -> difficult；每一级都要求检查最佳loglikelihood重复。
    sources: [MPLUS-EX7.9, MPLUS-WN14]
    note: 各级具体数值是本Skill的工程策略，不宣称为文献统一阈值。
    tiers:
      screening: [200, 40]
      verification: [1000, 200]
      difficult: [5000, 1000]

  - id: LPA-SELECT-001
    type: selection
    rule: 类别数不能由单一指标决定；先检查模型稳定性，再综合信息准则、似然比检验、分类质量、类别规模和实质解释。
    sources: [NYLUND-2007, MASYN-2013, MPLUS-WN14]

  - id: LPA-SELECT-002
    type: selection
    rule: BIC作为主要候选证据之一，但不得机械地把最低BIC等同于最终真值；与模型解释和其他证据综合判断。
    sources: [NYLUND-2007, MASYN-2013]

  - id: LPA-SELECT-003
    type: selection
    rule: Entropy反映分类清晰程度，不作为类别数选择的唯一标准。
    sources: [NYLUND-2007, MASYN-2013]

  - id: LPA-SELECT-004
    type: heuristic
    rule: 最小类别占比低于5%时给出“小类别”提示；低于1%时给出严重提示，但不自动否决模型。
    sources: []
    origin: 本Skill内部启发式提示
    note: 该阈值仅作应用层提醒，不标记为公认硬标准，也不用于自动否决模型。

  - id: LPA-SELECT-005
    type: selection
    rule: 当BIC、TECH11/TECH14、类别规模与可解释性明显冲突时，自动结论应为“证据不一致”，禁止强行输出唯一类别数。
    sources: [NYLUND-2007, MASYN-2013]

  - id: DATA-POLICY-001
    type: workflow_policy
    rule: 不默认Z标准化LPA指标。只有用户授权或研究设计明确要求时才标准化，并记录转换前后的变量映射与统计量。
    sources: []
    origin: 分析设计透明性规则
    note: 是否标准化取决于研究问题、量纲和希望类别反映绝对水平还是相对形状；不宣称 Masyn (2013) 规定了统一答案。

  - id: FIT-REF-001
    type: method_boundary
    rule: CFI_TLI约.95_RMSEA约.06_SRMR约.08只作为连续数据ML情境下的历史定位参照，且应组合解读。
    sources: [HU-BENTLER-1999, MARSH-HAU-WEN-2004]
    note: 不得写成跨领域发表硬门槛。

  - id: FIT-REF-002
    type: method_boundary
    rule: 有序分类指标使用WLSMV_DWLS时，不机械照搬连续数据ML的拟合阈值。
    sources: [XIA-YANG-2019]

  - id: SAMPLE-SIZE-001
    type: internal_heuristic
    rule: N=200_300等数字只作为Skill内部遗漏提醒线，不作为文献推荐的通用最小样本量。
    sources: [MACCALLUM-ETAL-1999, WOLF-ETAL-2013, TEIN-COXE-CHAM-2013, MPLUS-UG-CH12, MPLUS-UG-MONTECARLO]
    origin: 本Skill内部筛查线
    note: 实际建议应基于预期参数和完整模型的模拟功效分析。
