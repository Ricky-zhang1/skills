registry_name: Mplus分析来源登记
version: 1.1beta
last_verified: 2026-08-11
policy:
  authority_order:
  - Mplus官方用户手册与官方示例
  - Mplus官方Web Notes与专题资料
  - 同行评议的方法论文与权威手册章节
  - 成熟开源工程实现
  claim_types:
    official_syntax: 用于证明 Mplus 的命令、默认值、版本功能和输出格式。
    method_evidence: 用于证明统计方法的条件、性能与解释边界。
    internal_heuristic: 只用于触发提醒，必须明示为 Skill 内部筛查线，不得冒充文献阈值。
  note: Mplus 官方资料是语法与软件行为的一级来源，但“软件可以运行”不等于“方法适合当前研究”。GitHub工程只能用于自动化实现参考。
