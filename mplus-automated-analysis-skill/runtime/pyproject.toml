[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mplusflow"
version = "1.1b0"
description = "Standalone multi-family runtime for the Mplus Analysis Agent Skill"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<3",
  "scipy>=1.11,<2",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
  "pyreadstat>=1.2,<2",
  "PyYAML>=6,<7"
]

[project.scripts]
mplusflow = "mplusflow.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mplusflow*"]
